<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de archivos grandes</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:flex;justify-content:center;align-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f5f7;color:#1d1d1f}
.container{width:100%;max-width:480px;padding:30px;background:#fff;border-radius:20px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{margin:0 0 25px;text-align:center;font-size:25px;color:#0071e3}
label{display:block;margin:16px 0 7px;font-size:14px;font-weight:600}
input,select{width:100%;padding:13px 14px;border:1px solid #d2d2d7;border-radius:12px;background:#fff;color:#1d1d1f;font-size:16px;outline:none}
input:focus,select:focus{border-color:#0071e3}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#0071e3;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:hover{background:#005bb5}
button:disabled{background:#999;cursor:not-allowed}
#stopBtn{background:#e5e5ea;color:#1d1d1f}
#stopBtn:hover{background:#d1d1d6}
.progress-container{margin-top:22px}
progress{width:100%;height:14px}
#status{margin-top:14px;min-height:22px;text-align:center;font-size:14px;color:#6e6e73}
.info{margin-top:18px;padding:12px;border-radius:12px;background:#f5f5f7;font-size:13px;line-height:1.5;color:#6e6e73}
</style>
</head>
<body>
<div class="container">
<h1>Generador de archivos grandes</h1>

<div class="row">
<div>
<label for="size">Tamaño</label>
<input type="number" id="size" value="1" min="1" max="5120" step="1">
</div>
<div>
<label for="unit">Unidad</label>
<select id="unit">
<option value="MB">MB</option>
<option value="GB">GB</option>
</select>
</div>
</div>

<label for="type">Contenido</label>
<select id="type">
<option value="zero">Ceros (muy rápido)</option>
<option value="random">Bytes aleatorios</option>
<option value="text">Texto repetido</option>
</select>

<label for="filename">Nombre del archivo</label>
<input type="text" id="filename" value="archivo_grande.bin">

<div class="buttons">
<button id="generateBtn">Generar archivo</button>
<button id="stopBtn" disabled>Detener</button>
</div>

<div class="progress-container">
<progress id="progress" value="0" max="100"></progress>
</div>

<div id="status">Listo</div>

<div class="info">
Máximo: 5 GB.<br>
El archivo se escribe por bloques para no cargarlo entero en la memoria.
</div>
</div>

<script>
const generateBtn=document.getElementById("generateBtn");
const stopBtn=document.getElementById("stopBtn");
const sizeInput=document.getElementById("size");
const unitInput=document.getElementById("unit");
const typeInput=document.getElementById("type");
const filenameInput=document.getElementById("filename");
const progress=document.getElementById("progress");
const status=document.getElementById("status");

let detener=false;

function calcularBytes(){
    const size=Number(sizeInput.value);
    if(!Number.isFinite(size)||size<=0) throw new Error("Introduce un tamaño válido.");
    const bytes=unitInput.value==="MB"
        ? Math.floor(size*1024*1024)
        : Math.floor(size*1024*1024*1024);
    const maxBytes=5*1024*1024*1024;
    if(bytes>maxBytes) throw new Error("El máximo permitido es 5 GB.");
    return bytes;
}

function crearBloqueCeros(tamano){
    return new Uint8Array(tamano);
}

function crearBloqueTexto(tamano){
    const texto="Este es un archivo de prueba generado automáticamente. ABCDEFGHIJKLMNOPQRSTUVWXYZ 0123456789\n";
    const datos=new TextEncoder().encode(texto);
    const bloque=new Uint8Array(tamano);
    for(let i=0;i<tamano;i++) bloque[i]=datos[i%datos.length];
    return bloque;
}

function crearBloqueAleatorio(tamano){
    const bloque=new Uint8Array(tamano);
    const max=65536;
    for(let inicio=0;inicio<tamano;inicio+=max){
        const fin=Math.min(inicio+max,tamano);
        crypto.getRandomValues(bloque.subarray(inicio,fin));
    }
    return bloque;
}

function formatearBytes(bytes){
    const GB=1024**3,MB=1024**2,KB=1024;
    if(bytes>=GB)return(bytes/GB).toFixed(2)+" GB";
    if(bytes>=MB)return(bytes/MB).toFixed(2)+" MB";
    if(bytes>=KB)return(bytes/KB).toFixed(2)+" KB";
    return bytes+" B";
}

async function generarArchivo(){
    detener=false;
    try{
        if(typeof window.showSaveFilePicker!=="function"){
            throw new Error("Este navegador no permite esta función. Prueba Chrome o Edge en HTTPS.");
        }

        const bytesTotales=calcularBytes();
        let filename=filenameInput.value.trim()||"archivo_grande.bin";

        const handle=await window.showSaveFilePicker({
            suggestedName:filename,
            types:[{
                description:"Archivo",
                accept:{"application/octet-stream":[".bin"]}
            }]
        });

        const writable=await handle.createWritable();

        generateBtn.disabled=true;
        stopBtn.disabled=false;
        progress.value=0;
        status.textContent="Generando...";

        const TAMANO_BLOQUE=4*1024*1024;
        let escritos=0;
        let bloqueFijo=null;

        if(typeInput.value==="zero") bloqueFijo=crearBloqueCeros(TAMANO_BLOQUE);
        else if(typeInput.value==="text") bloqueFijo=crearBloqueTexto(TAMANO_BLOQUE);

        const inicio=performance.now();

        while(escritos<bytesTotales){
            if(detener){
                try{await writable.abort();}catch(_){}
                status.textContent="Generación cancelada.";
                progress.value=0;
                return;
            }

            const restantes=bytesTotales-escritos;
            const cantidad=Math.min(TAMANO_BLOQUE,restantes);
            let bloque;

            if(typeInput.value==="random"){
                bloque=crearBloqueAleatorio(cantidad);
            }else{
                bloque=cantidad===TAMANO_BLOQUE
                    ? bloqueFijo
                    : bloqueFijo.slice(0,cantidad);
            }

            await writable.write(bloque);
            escritos+=cantidad;

            const porcentaje=(escritos/bytesTotales)*100;
            progress.value=porcentaje;

            const segundos=(performance.now()-inicio)/1000;
            const velocidad=segundos>0?escritos/segundos:0;

            status.textContent=
                `${porcentaje.toFixed(1)}% · ${formatearBytes(escritos)} / ${formatearBytes(bytesTotales)} · ${formatearBytes(velocidad)}/s`;

            await new Promise(resolve=>setTimeout(resolve,0));
        }

        await writable.close();
        progress.value=100;
        status.textContent=`¡Listo! ${formatearBytes(bytesTotales)} generados.`;

    }catch(error){
        console.error(error);
        status.textContent=error.name==="AbortError"
            ?"Guardado cancelado."
            :"Error: "+error.message;
    }finally{
        generateBtn.disabled=false;
        stopBtn.disabled=true;
    }
}

generateBtn.addEventListener("click",generarArchivo);
stopBtn.addEventListener("click",()=>{
    detener=true;
    status.textContent="Deteniendo...";
});

typeInput.addEventListener("change",()=>{
    if(typeInput.value==="random"||typeInput.value==="zero"){
        if(!filenameInput.value.toLowerCase().endsWith(".bin"))
            filenameInput.value="archivo_grande.bin";
    }else{
        if(!filenameInput.value.toLowerCase().endsWith(".txt"))
            filenameInput.value="archivo_grande.txt";
    }
});
</script>
</body>
</html>
